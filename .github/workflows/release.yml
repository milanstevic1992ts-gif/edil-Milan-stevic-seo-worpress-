name: EMS Local SEO Release

on:
  push:
    branches: [ main ]
    paths:
      - 'ems-local-seo.php'
      - 'includes/**'
      - 'assets/**'
      - 'readme.txt'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: PHP syntax check
        run: find . -path './.git' -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Read plugin version
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n 's/^ \* Version: //p' ems-local-seo.php | head -n1 | tr -d '\r')
          if [ -z "$VERSION" ]; then
            echo 'Plugin version not found' >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check existing release
        id: release_check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Build installable ZIP
        if: steps.release_check.outputs.exists != 'true'
        run: |
          rm -rf build
          mkdir -p build/ems-local-seo
          rsync -a ./ build/ems-local-seo/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'build/' \
            --exclude '.DS_Store' \
            --exclude '*.zip'
          cd build
          zip -r ems-local-seo.zip ems-local-seo
          sha256sum ems-local-seo.zip > SHA256SUMS.txt

      - name: Create GitHub Release and version tag
        if: steps.release_check.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" \
            build/ems-local-seo.zip \
            build/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "EMS Local SEO $TAG" \
            --generate-notes

      - name: Release already exists
        if: steps.release_check.outputs.exists == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: echo "Release $TAG already exists; nothing to publish."
