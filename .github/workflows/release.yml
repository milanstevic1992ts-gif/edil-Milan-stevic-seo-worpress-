name: EMS Local SEO Release

on:
  workflow_run:
    workflows: [ 'EMS Local SEO CI' ]
    types: [ completed ]

permissions:
  contents: write

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main with history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate tested source against main
        id: gate
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
          TESTED_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          ELIGIBLE=false
          if [ "$TESTED_BRANCH" = "main" ] || [[ "$TESTED_BRANCH" == release/* ]]; then
            if git cat-file -e "$TESTED_SHA^{commit}" 2>/dev/null; then
              if git diff --quiet HEAD "$TESTED_SHA" -- \
                ems-local-seo.php includes assets readme.txt composer.json uninstall.php; then
                ELIGIBLE=true
              fi
            fi
          fi
          echo "eligible=$ELIGIBLE" >> "$GITHUB_OUTPUT"
          echo "tested_branch=$TESTED_BRANCH" >> "$GITHUB_OUTPUT"
          echo "main_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ "$ELIGIBLE" != "true" ]; then
            echo "Release skipped: tested plugin source is not an eligible main-equivalent build."
          fi

      - name: Setup PHP
        if: steps.gate.outputs.eligible == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: PHP syntax check
        if: steps.gate.outputs.eligible == 'true'
        run: find . -path './.git' -prune -o -path './vendor' -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Read plugin version
        if: steps.gate.outputs.eligible == 'true'
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n 's/^ \* Version: //p' ems-local-seo.php | head -n1 | tr -d '\r')
          if [ -z "$VERSION" ]; then
            echo 'Plugin version not found' >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check existing release
        if: steps.gate.outputs.eligible == 'true'
        id: release_check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Build clean installable ZIP
        if: steps.gate.outputs.eligible == 'true' && steps.release_check.outputs.exists != 'true'
        run: |
          rm -rf build
          mkdir -p build/ems-local-seo
          rsync -a ./ build/ems-local-seo/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'build/' \
            --exclude 'tests/' \
            --exclude 'vendor/' \
            --exclude 'phpunit.xml.dist' \
            --exclude '.DS_Store' \
            --exclude '*.zip'
          cd build
          zip -r ems-local-seo.zip ems-local-seo
          sha256sum ems-local-seo.zip > SHA256SUMS.txt

      - name: Verify ZIP
        if: steps.gate.outputs.eligible == 'true' && steps.release_check.outputs.exists != 'true'
        run: |
          unzip -l build/ems-local-seo.zip | grep -q 'ems-local-seo/ems-local-seo.php'
          rm -rf /tmp/release-check
          mkdir -p /tmp/release-check
          unzip -q build/ems-local-seo.zip -d /tmp/release-check
          php -l /tmp/release-check/ems-local-seo/ems-local-seo.php

      - name: Create GitHub Release and version tag
        if: steps.gate.outputs.eligible == 'true' && steps.release_check.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          TARGET_SHA: ${{ steps.gate.outputs.main_sha }}
        run: |
          gh release create "$TAG" \
            build/ems-local-seo.zip \
            build/SHA256SUMS.txt \
            --target "$TARGET_SHA" \
            --title "EMS Local SEO $TAG" \
            --generate-notes

      - name: Release already exists
        if: steps.gate.outputs.eligible == 'true' && steps.release_check.outputs.exists == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: echo "Release $TAG already exists; nothing to publish."
