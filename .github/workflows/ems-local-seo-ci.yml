name: EMS Local SEO CI

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.0', '8.2' ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: PHP syntax check
        run: find . -path './.git' -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l

  package:
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build installable plugin ZIP
        run: |
          rm -rf build
          mkdir -p build/ems-local-seo
          rsync -a ./ build/ems-local-seo/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'build/' \
            --exclude '.DS_Store'
          cd build
          zip -r ems-local-seo.zip ems-local-seo

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: ems-local-seo
          path: build/ems-local-seo.zip
          if-no-files-found: error
