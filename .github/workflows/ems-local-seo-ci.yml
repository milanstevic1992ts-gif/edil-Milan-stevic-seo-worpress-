name: EMS Local SEO CI

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
  workflow_dispatch:

jobs:
  lint-and-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: PHP syntax check
        run: find . -path './.git' -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Build installable plugin ZIP
        run: |
          rm -rf build
          mkdir -p build/ems-local-seo
          rsync -a ./ build/ems-local-seo/             --exclude '.git/'             --exclude '.github/'             --exclude 'build/'             --exclude '.DS_Store'
          cd build
          zip -r ems-local-seo.zip ems-local-seo

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: ems-local-seo
          path: build/ems-local-seo.zip
          if-no-files-found: error
